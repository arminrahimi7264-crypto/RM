name: Build VST3
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --target SimpleSynth_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleSynth-VST3-${{ matrix.os }}
          path: build/SimpleSynth_artefacts/**/VST3/
